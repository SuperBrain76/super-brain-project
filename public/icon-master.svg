<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Background: deep forest green -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#1a3a2a"/>

  <!-- Subtle radial glow behind the S -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#b8972a" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#1a3a2a" stop-opacity="0"/>
  </radialGradient>
  <circle cx="512" cy="512" r="400" fill="url(#glow)"/>

  <!-- Thin gold decorative ring -->
  <circle cx="512" cy="512" r="370" fill="none" stroke="#b8972a" stroke-width="2" opacity="0.35"/>

  <!-- "SB" monogram in gold — elegant serif-style constructed from paths -->
  <!-- S letterform -->
  <text
    x="512"
    y="590"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="420"
    font-weight="700"
    text-anchor="middle"
    fill="#b8972a"
    letter-spacing="-20"
  >SB</text>

  <!-- Thin gold underline accent -->
  <rect x="262" y="660" width="500" height="4" rx="2" fill="#b8972a" opacity="0.6"/>
</svg>
