name: Auto Send Launch (temporary)

# TEMPORARY one-shot sender. Runs automatically when ops/SEND_LAUNCH changes,
# using the CRON_SECRET + APP_URL repo secrets (no manual dispatch/login needed).
# The file's contents choose the mode: "test", "everyone", or anything else = dry_run.
# Removed right after the launch email is sent.

on:
  push:
    paths:
      - "ops/SEND_LAUNCH"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read mode and send
        run: |
          MODE=$(tr -d '[:space:]' < ops/SEND_LAUNCH)
          case "$MODE" in
            test)     QS="?test=dylan@vidaevergreen.ae" ;;
            everyone) QS="" ;;
            *)        QS="?dry_run=true" ;;
          esac
          echo "Mode: '$MODE'"
          HTTP=$(curl --silent --output /tmp/r.json --write-out "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/admin/send-season-launch${QS}")
          echo "HTTP: $HTTP"
          echo "Response:"; cat /tmp/r.json | jq . 2>/dev/null || cat /tmp/r.json
          test "$HTTP" -ge 200 && test "$HTTP" -lt 300
