# ── Automated match result ingestion ─────────────────────────
# Polls /api/cron/ingest-results every 5 minutes.
#
# The endpoint:
#   1. Checks three pre-flight gates (tournament window, DB fixtures
#      in ±3h window, active match window) — skips if nothing to do
#   2. Calls API-Football Pro for live/recent WC2026 fixtures
#   3. Updates fixtures table with status and (only for FT) scores
#   4. auto_score_predictions DB trigger fires → predictions scored
#   5. Leaderboard RPCs update on next user read (computed on-demand)
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   CRON_SECRET   — shared secret (same as Vercel env var CRON_SECRET)
#   APP_URL       — https://superbrain.social  (no trailing slash)
#
# Cost: Free — GitHub Actions free tier (uses ~40 min/month of WC2026)
# Frequency: every 5 minutes (GitHub scheduler ±2 min drift, acceptable)
# Duration per run: ~2-5 seconds

name: Ingest Match Results

on:
  schedule:
    - cron: "*/5 * * * *"

  # Manual trigger — useful for testing and emergency re-runs
  workflow_dispatch:

jobs:
  ingest:
    name: Poll ingestion endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate secrets are configured
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::error::APP_URL secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          echo "Secrets validated."

      - name: Call ingest-results endpoint
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/ingest-results")

          echo "HTTP status: $HTTP_STATUS"
          echo ""
          echo "Response:"
          # Pretty-print if jq available (always is on ubuntu-latest), raw fallback
          cat /tmp/response.json | jq . 2>/dev/null || cat /tmp/response.json
          echo ""

          # Extract key metrics for GitHub Actions summary
          UPDATED=$(cat /tmp/response.json | jq -r '.updated // "n/a"' 2>/dev/null)
          CHECKED=$(cat /tmp/response.json | jq -r '.checked // "n/a"' 2>/dev/null)
          SKIPPED=$(cat /tmp/response.json | jq -r '.skipped // false' 2>/dev/null)
          REASON=$(cat /tmp/response.json | jq -r '.reason // ""' 2>/dev/null)
          QUOTA_USED=$(cat /tmp/response.json | jq -r '.quota.requestsUsed // "?"' 2>/dev/null)
          QUOTA_LIMIT=$(cat /tmp/response.json | jq -r '.quota.requestsLimit // "?"' 2>/dev/null)
          DURATION=$(cat /tmp/response.json | jq -r '.duration // "?"' 2>/dev/null)
          WARNING=$(cat /tmp/response.json | jq -r '.warning // ""' 2>/dev/null)

          if [ "$SKIPPED" = "true" ]; then
            echo "::notice::Skipped — $REASON"
          elif [ -n "$WARNING" ]; then
            echo "::warning::$WARNING — $(cat /tmp/response.json | jq -r '.message // ""' 2>/dev/null)"
          else
            echo "::notice::Updated: $UPDATED | Checked: $CHECKED | Quota: $QUOTA_USED/$QUOTA_LIMIT | ${DURATION}ms"
          fi

          # Non-2xx fails the job so GitHub marks the run as failed
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Ingestion endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Advance knockout fixtures
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/ko_response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/advance-knockout")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/ko_response.json | jq . 2>/dev/null || cat /tmp/ko_response.json

          CHANGES=$(cat /tmp/ko_response.json | jq -r '.changes | length' 2>/dev/null || echo "0")
          GROUPS=$(cat /tmp/ko_response.json | jq -r '.completedGroups // 0' 2>/dev/null)
          if [ "$CHANGES" != "0" ] && [ "$CHANGES" != "null" ]; then
            echo "::notice::Knockout advanced — $CHANGES slot(s) filled, $GROUPS/12 groups complete"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::advance-knockout returned HTTP $HTTP_STATUS"
            exit 1
          fi
