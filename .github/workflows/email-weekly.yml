name: Email — Weekly digest

# One digest a week across every active sport: how last week finished, what is
# coming this week. Silent until SEASON_EMAILS_ENABLED=true.
#
# Every three hours. The route itself decides: it sends at most ONE digest per
# ISO week, when the week's first kickoff is about 36 hours away. Running often
# is what makes "36 hours" mean 36 hours rather than "some time that day"; the
# week key is what stops it ever sending twice.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "dry=1 shows what would go out, to how many, without sending"
        required: false
        default: "0"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly email engine
        run: |
          curl -fsSL --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/email-weekly?dry=${{ github.event.inputs.dry || '0' }}"
