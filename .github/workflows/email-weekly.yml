name: Email — Weekly (ramp / matchweek / results)

# The per-league weekly email engine. Runs daily; the route decides per league
# whether to send a pre-launch ramp nudge, a matchweek fixtures email, or a
# results + leaderboard wrap. Stays silent until SEASON_EMAILS_ENABLED=true.

# Every three hours, because the matchweek email is timed 36 hours before the
# round's first kickoff and a daily run can only ever be accurate to a day.
# Sending is still gated per competition by a round marker, so a round can never
# be emailed twice however often this runs.
# SCHEDULE PAUSED 2 Sep 2026 while the email is regrouped from one-per-league
# to one-per-sport. Nine active competitions meant a single user could receive
# seven emails in 48 hours. Dispatch still works; restore the cron line below
# once grouping has shipped and been verified.
on:
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly email engine
        run: |
          curl -fsSL --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/email-weekly"
