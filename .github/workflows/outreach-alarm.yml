# Does the campaign still send? Nothing else in this repo asks that question.
#
# Instantly suspended the campaign on 28 September 2026 and it was discovered on
# 21 October — twenty-three days. Every job around it stayed green the whole
# time, because they all succeeded: the supply push ran 184 times, discovery
# grew the CRM to 4,910 venues, config-health went green. A campaign with
# nowhere to send is not a failing job, so nothing failed.
#
# This job exists only to fail. It goes red when the campaign is not actively
# sending, which is the one state no other check here can produce.

name: Outreach alarm

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  alarm:
    runs-on: ubuntu-latest
    steps:
      - name: Is the campaign sending?
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          BODY=$(curl -sS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/admin/outreach-health") || {
            echo "::error::outreach-health unreachable — the alarm itself is blind."; exit 1; }

          STATE=$(printf '%s' "$BODY" | sed -n 's/.*"campaign_status":"\([^"]*\)".*/\1/p')
          HEAD=$(printf  '%s' "$BODY" | sed -n 's/.*"headline":"\([^"]*\)".*/\1/p')
          LAST=$(printf  '%s' "$BODY" | sed -n 's/.*"last_day_with_sends":"\([^"]*\)".*/\1/p')
          {
            echo "### Outreach: ${HEAD:-unknown}"
            echo ""
            echo "- campaign status: \`${STATE:-unknown}\`"
            echo "- last day with sends: \`${LAST:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${STATE:-}" != "active" ]; then
            echo "::error::The Instantly campaign is NOT ACTIVE (status '${STATE:-unknown}'). Nothing has sent since ${LAST:-unknown}. A negative status is set by Instantly itself and bounce protection is the usual cause: fix the bounce rate BEFORE resuming, or it re-suspends and the sending domain takes the damage."
            exit 1
          fi

          # WHAT THIS MAY AND MAY NOT FIRE ON.
          #
          # It fired six times a day on its first night, on HIGH BOUNCE RISK
          # computed from sends made before the ownership gate existed — a
          # number that could not fall until new sends displaced it, over a
          # condition the ramp was already handling by holding itself at 12.
          # Dylan got two emails about nothing he could act on at 2am. An alarm
          # that does that is in the spam folder within a week, and then the one
          # night it means "the campaign stopped" nobody looks.
          #
          # So the bar is: not self-correcting, AND actionable now.
          #   campaign not sending   -> always (checked above; nothing else sees it)
          #   bounces on CURRENT     -> yes; the gate is failing and sending must stop
          #     sends (last 7 days)
          #   nothing left to send   -> only when the queue AND the buffer are both
          #                             empty. A queue drained between pushes is
          #                             normal and the supply job refills it.
          # Everything else belongs in the morning brief, which reports it all.
          RECENT=$(printf '%s' "$BODY" | sed -n 's/.*"recent_7d_pct":\([0-9.]*\).*/\1/p')
          QUEUED=$(printf '%s' "$BODY" | sed -n 's/.*"queued_in_instantly":\([0-9]*\).*/\1/p')
          BUFFER=$(printf '%s' "$BODY" | sed -n 's/.*"local_buffer":\([0-9]*\).*/\1/p')

          if printf '%s' "$BODY" | grep -q '"HIGH BOUNCE RISK"'; then
            echo "::error::Current sends are bouncing — ${RECENT:-?}% of venues contacted in the last 7 days. The ownership gate is not holding. Stop sending and find the failing class before the domain takes the damage."
            exit 1
          fi

          if [ "${QUEUED:-1}" = "0" ] && [ "${BUFFER:-1}" = "0" ]; then
            echo "::error::Nothing left to send anywhere: 0 queued in Instantly AND 0 in the buffer. Discovery or the push has stopped — this will not fix itself."
            exit 1
          fi

          echo "Campaign is active. Headline: $HEAD (queued=${QUEUED:-?} buffer=${BUFFER:-?} recent-bounce=${RECENT:-n/a}%)"
