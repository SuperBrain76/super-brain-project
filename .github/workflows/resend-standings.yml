name: Resend Standings Email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send standings email (force)
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/response.json \
            --write-out "%{http_code}" \
            --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/email-standings?force=true")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json | jq . 2>/dev/null || cat /tmp/response.json

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Endpoint returned HTTP $HTTP_STATUS"
            exit 1
          fi
