name: Email — Match Day Reminder

on:
  schedule:
    # Runs at 15:00 UTC daily — 3h before the typical first kick-off (18:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger match-day email
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/email-matchday"
